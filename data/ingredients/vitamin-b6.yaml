id: vitamin-b6
name: Vitamin B6
type: vitamin
synonyms: [pyridoxine, pyridoxine hydrochloride, pyridoxal 5'-phosphate, P5P, PLP, pyridoxamine]
forms: [pyridoxine hydrochloride, pyridoxal 5'-phosphate (P5P)]
reference_intakes:
  population: US adults 19+ (NASEM Dietary Reference Intakes)
  rda:
    - {group: adults 19-50, amount: 1.3, unit: mg}
    - {group: men 51+, amount: 1.7, unit: mg}
    - {group: women 51+, amount: 1.5, unit: mg}
  ul: {amount: 100, unit: mg, applies_to: total intake, scope: total}
  notes: EFSA set a much lower adult UL of 12 mg/day in 2023 because of neuropathy reports at lower doses. Consider using the stricter threshold for a caution-level flag.
food_sources: [chickpeas, tuna, salmon, chicken breast, potatoes, bananas, fortified cereals]
effect_groups: []
recommendable: false
recommendable_note: Deficiency is uncommon. B6 often appears in multivitamins, B-complex, "energy", and magnesium products, so stacking is the main risk.
timing:
  best_slot: any
  take_with: either
  note: "No meaningful timing effect."
  sources: [ods-vitamin-b6]
claims:
  - id: CLM-B6-01
    outcome: Heart attack and death from B-vitamin supplementation (B6, folic acid, B12)
    population: Adults, including those with existing cardiovascular disease
    direction: no_effect
    evidence_grade: A
    summary: A Cochrane review of 15 trials (71,422 people) found no effect on heart attacks or death (high-quality evidence). It found a small reduction in stroke.
    sources: [review-cochrane-homocysteine-2017]
safety_notes:
  - level: caution
    text: Long-term high-dose B6 can cause peripheral neuropathy (numbness, tingling). Reports at doses well below the US UL led EFSA to lower its UL to 12 mg/day.
    sources: [ods-vitamin-b6, efsa-b6-ul-2023]
sources: [ods-vitamin-b6, efsa-b6-ul-2023]
status: draft
reviewed_by: null
reviewed_at: null
