name: Validate knowledge base
on:
  push:
    paths: ["data/**", "scripts/**", "package*.json", ".github/workflows/validate-data.yml"]
  pull_request:
    paths: ["data/**", "scripts/**", "package*.json", ".github/workflows/validate-data.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
